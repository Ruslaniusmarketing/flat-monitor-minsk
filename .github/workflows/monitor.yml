name: flat-monitor

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"   # каждые 10 минут (GitHub может задерживать на 5–15 мин)
  workflow_dispatch:
    inputs:
      mode:
        description: "run — обычный проход, test — тестовое сообщение, dry — проверка без отправки"
        type: choice
        default: run
        options: [run, test, dry]

permissions:
  contents: write

concurrency:
  group: flat-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # первый запуск долгий; обычный проход — несколько минут
    defaults:
      run:
        working-directory: flat-monitor-minsk   # файлы проекта лежат в этой папке
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: flat-monitor-minsk/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --mode "${{ github.event.inputs.mode || 'run' }}"

      - name: Save state
        if: ${{ (github.event.inputs.mode || 'run') == 'run' }}
        run: |
          git config user.name "flat-monitor-bot"
          git config user.email "flat-monitor-bot@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || (git commit -m "state update" && git pull --rebase && git push)
